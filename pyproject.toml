[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moatrader"
version = "1.0.0"
description = "PIT financial evidence, economic DCF, reverse DCF, and expectation-gap analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "json-repair>=0.63",
    "lxml>=5.0",
    "pymupdf>=1.26",
    "pydantic>=2.10",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=2.0"]
ocr = ["numpy>=1.26", "paddleocr==3.5.0", "paddlepaddle>=3.2.0"]
all = [
    "numpy>=1.26",
    "openai>=2.0",
    "paddleocr==3.5.0",
    "paddlepaddle>=3.2.0",
    "pytest>=8.0",
]

[project.scripts]
moatrader = "moatrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
